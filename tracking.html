<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tracking Pengiriman — SITTA</title>
  <link rel="stylesheet" href="CSS/style.css">
  
  <!-- Internal CSS -->
  <style>
    #tracking-content h1 {
      border-left: 4px solid var(--kuning-ut);
      padding-left: 12px;
    }
    #inputDO {
      font-size: 14px;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav id="navbar">
     <a href="dashboard.html" id="nav-brand">SITTA</a> 
    <div id="nav-menu">
      <a href="stok.html">Informasi Bahan Ajar</a>
      <a href="tracking.html">Tracking Pengiriman</a>
      <div class="dropdown">
        <a href="#" id="btnLaporan">Laporan ▾</a>
        <div class="dropdown-menu" id="dropdownLaporan">
          <a href="#">Monitoring Progress DO</a>
          <a href="#">Rekap Bahan Ajar</a>
        </div>
      </div>
      <a href="#">Histori Transaksi</a>
      <a href="index.html" id="btnLogout">Keluar</a>
    </div>
  </nav>

  <!-- Konten -->
  <main id="tracking-content">
    <h1>Tracking Pengiriman</h1>
    <p>Masukkan Nomor Delivery Order untuk melacak pengiriman.</p>

    <!-- Form pencarian -->
    <div id="tracking-form">
      <input type="text" id="inputDO" placeholder="Masukkan Nomor DO, cth: 2023001234">
      <button id="btnCari">Cari</button>
    </div>

    <!-- Hasil tracking (tersembunyi dulu) -->
    <div id="hasil-tracking" style="display:none;">

      <!-- Info utama -->
      <div id="tracking-hero">
        <div>
          <h2 id="namaMahasiswa"></h2>
          <p id="nomorDO"></p>
        </div>
        <div id="status-badge"></div>
      </div>

      <!-- Progress bar -->
      <div id="tracking-progress">
        <div id="progress-label">
          <span>Progress Pengiriman</span>
          <span id="progress-persen"></span>
        </div>
        <div id="progress-bar-wrap">
          <div id="progress-bar"></div>
        </div>
      </div>

      <!-- Detail info -->
      <div id="tracking-detail">
        <div class="detail-item">
          <label>Ekspedisi</label>
          <span id="detailEkspedisi"></span>
        </div>
        <div class="detail-item">
          <label>Tanggal Kirim</label>
          <span id="detailTanggal"></span>
        </div>
        <div class="detail-item">
          <label>Kode Paket</label>
          <span id="detailPaket"></span>
        </div>
        <div class="detail-item">
          <label>Total Pembayaran</label>
          <span id="detailTotal"></span>
        </div>
      </div>

      <!-- Timeline perjalanan -->
      <div id="tracking-timeline">
        <h3>Perjalanan Paket</h3>
        <ul id="listPerjalanan"></ul>
      </div>

    </div>

    <!-- Pesan tidak ditemukan -->
    <div id="tidak-ditemukan" style="display:none;">
      <p>Nomor DO <strong id="noDOGagal"></strong> tidak ditemukan.</p>
    </div>

  </main>

  <script src="JS/data.js"></script>
  <script src="JS/script.js"></script>
 

</body>
</html>
