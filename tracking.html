<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tracking Pengiriman — SITTA</title>
  <link rel="stylesheet" href="CSS/style.css">
</head>
<body>

  <!-- Navbar -->
  <nav id="navbar">
     <a href="dashboard.html" id="nav-brand">SITTA</a> 
    <div id="nav-menu">
      <a href="stok.html">Informasi Bahan Ajar</a>
      <a href="tracking.html">Tracking Pengiriman</a>
      <div class="dropdown">
        <a href="#" id="btnLaporan">Laporan ▾</a>
        <div class="dropdown-menu" id="dropdownLaporan">
          <a href="#">Monitoring Progress DO</a>
          <a href="#">Rekap Bahan Ajar</a>
        </div>
      </div>
      <a href="#">Histori Transaksi</a>
      <a href="index.html" id="btnLogout">Keluar</a>
    </div>
  </nav>

  <!-- Konten -->
  <main id="tracking-content">
    <h1>Tracking Pengiriman</h1>
    <p>Masukkan Nomor Delivery Order untuk melacak pengiriman.</p>

    <!-- Form pencarian -->
    <div id="tracking-form">
      <input type="text" id="inputDO" placeholder="Masukkan Nomor DO, cth: 2023001234">
      <button id="btnCari">Cari</button>
    </div>

    <!-- Hasil tracking (tersembunyi dulu) -->
    <div id="hasil-tracking" style="display:none;">

      <!-- Info utama -->
      <div id="tracking-hero">
        <div>
          <h2 id="namaMahasiswa"></h2>
          <p id="nomorDO"></p>
        </div>
        <div id="status-badge"></div>
      </div>

      <!-- Progress bar -->
      <div id="tracking-progress">
        <div id="progress-label">
          <span>Progress Pengiriman</span>
          <span id="progress-persen"></span>
        </div>
        <div id="progress-bar-wrap">
          <div id="progress-bar"></div>
        </div>
      </div>

      <!-- Detail info -->
      <div id="tracking-detail">
        <div class="detail-item">
          <label>Ekspedisi</label>
          <span id="detailEkspedisi"></span>
        </div>
        <div class="detail-item">
          <label>Tanggal Kirim</label>
          <span id="detailTanggal"></span>
        </div>
        <div class="detail-item">
          <label>Kode Paket</label>
          <span id="detailPaket"></span>
        </div>
        <div class="detail-item">
          <label>Total Pembayaran</label>
          <span id="detailTotal"></span>
        </div>
      </div>

      <!-- Timeline perjalanan -->
      <div id="tracking-timeline">
        <h3>Perjalanan Paket</h3>
        <ul id="listPerjalanan"></ul>
      </div>

    </div>

    <!-- Pesan tidak ditemukan -->
    <div id="tidak-ditemukan" style="display:none;">
      <p>Nomor DO <strong id="noDOGagal"></strong> tidak ditemukan.</p>
    </div>

  </main>

  <script src="JS/data.js"></script>
  <script src="JS/script.js"></script>
  <script>
    // Cek login
    var userLogin = JSON.parse(sessionStorage.getItem('userLogin'));
    if (!userLogin) window.location.href = 'index.html';

    // Dropdown & logout
    document.getElementById('btnLaporan').addEventListener('click', function(e) {
      e.preventDefault();
      var menu = document.getElementById('dropdownLaporan');
      menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
    });
    document.getElementById('btnLogout').addEventListener('click', function(e) {
  e.preventDefault();
  if (confirm('Apakah Anda yakin ingin keluar?')) {
    sessionStorage.removeItem('userLogin');
    window.location.href = 'index.html';
  }
});

    // Tombol Cari
    document.getElementById('btnCari').addEventListener('click', function() {
      cariDO();
    });

    // Enter key juga bisa cari
    document.getElementById('inputDO').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') cariDO();
    });

    function cariDO() {
      var noDO = document.getElementById('inputDO').value.trim();

      // Sembunyikan hasil sebelumnya
      document.getElementById('hasil-tracking').style.display   = 'none';
      document.getElementById('tidak-ditemukan').style.display  = 'none';

      if (!noDO) {
        alert('Masukkan Nomor DO terlebih dahulu!');
        return;
      }

      // Cari di dataTracking dari data.js
      var data = dataTracking[noDO];

      if (!data) {
        document.getElementById('noDOGagal').textContent = noDO;
        document.getElementById('tidak-ditemukan').style.display = 'block';
        return;
      }

      // Isi data nama & nomor DO
      document.getElementById('namaMahasiswa').textContent = data.nama;
      document.getElementById('nomorDO').textContent = 'No. DO: ' + data.nomorDO;

      // Status badge
      var badge = document.getElementById('status-badge');
      badge.textContent = data.status;
      badge.className = '';
      if (data.status === 'Dikirim') {
        badge.style.background = '#27ae60';
      } else if (data.status === 'Dalam Perjalanan') {
        badge.style.background = '#f39c12';
      } else {
        badge.style.background = '#2980b9';
      }

      // Progress bar
      var persen = data.status === 'Dikirim' ? 100 :
                   data.status === 'Dalam Perjalanan' ? 60 : 30;
      document.getElementById('progress-persen').textContent = persen + '%';
      document.getElementById('progress-bar').style.width = persen + '%';
      document.getElementById('progress-bar').style.background =
        persen === 100 ? '#27ae60' : persen >= 60 ? '#f39c12' : '#2980b9';

      // Detail
      document.getElementById('detailEkspedisi').textContent = data.ekspedisi;
      document.getElementById('detailTanggal').textContent   = data.tanggalKirim;
      document.getElementById('detailPaket').textContent     = data.paket;
      document.getElementById('detailTotal').textContent     = data.total;

      // Timeline perjalanan
      var list = document.getElementById('listPerjalanan');
      list.innerHTML = '';
      data.perjalanan.forEach(function(p, i) {
        var li = document.createElement('li');
        li.innerHTML =
          '<div class="tl-dot"></div>' +
          '<div class="tl-info">' +
            '<span class="tl-waktu">' + p.waktu + '</span>' +
            '<span class="tl-keterangan">' + p.keterangan + '</span>' +
          '</div>';
        li.className = i === data.perjalanan.length - 1 ? 'tl-item tl-aktif' : 'tl-item tl-selesai';
        list.appendChild(li);
      });

      // Tampilkan hasil
      document.getElementById('hasil-tracking').style.display = 'block';
    }
  </script>

</body>
</html>
