<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — SITTA</title>
  <link rel="stylesheet" href="CSS/style.css">

</head>
<body>
   <!-- Navigasi atas -->
  <nav id="navbar">
    <a href="dashboard.html" id="nav-brand">SITTA</a>
    <div id="nav-menu">
      <a href="stok.html">Informasi Bahan Ajar</a>
      <a href="tracking.html">Tracking Pengiriman</a>

      <!-- Dropdown Laporan -->
      <div class="dropdown">
        <a href="#" id="btnLaporan">Laporan ▾</a>
        <div class="dropdown-menu" id="dropdownLaporan">
          <a href="#">Monitoring Progress DO</a>
          <a href="#">Rekap Bahan Ajar</a>
        </div>
      </div>

      <a href="#">Histori Transaksi</a>
      <a href="index.html" id="btnLogout">Keluar</a>
    </div>
  </nav>

  <!-- Konten utama -->
  <main id="dashboard-content">
    <h1 id="sapaan">...</h1>
    <p id="info-user"></p>

   <div id="kartu-menu">
  <a href="stok.html" class="kartu">
    <div class="kartu-icon">BA</div>
    <div>Informasi Bahan Ajar</div>
  </a>
  <a href="tracking.html" class="kartu">
    <div class="kartu-icon">TK</div>
    <div>Tracking Pengiriman</div>
  </a>
  <a href="#" class="kartu">
    <div class="kartu-icon">MO</div>
    <div>Monitoring DO</div>
  </a>
  <a href="#" class="kartu">
    <div class="kartu-icon">HT</div>
    <div>Histori Transaksi</div>
  </a>
</div>
  </main>

  <script src="JS/data.js"></script>
  <script src="JS/script.js"></script>
  <script>
    // Cek apakah sudah login
    var userLogin = JSON.parse(sessionStorage.getItem('userLogin'));
    if (!userLogin) {
      window.location.href = 'index.html';
    }

    // Tampilkan greeting berdasarkan jam
    var jam = new Date().getHours();
    var sapa = '';
    if (jam >= 5 && jam < 11) {
      sapa = 'Selamat Pagi';
    } else if (jam >= 11 && jam < 15) {
      sapa = 'Selamat Siang';
    } else if (jam >= 15 && jam < 18) {
      sapa = 'Selamat Sore';
    } else {
      sapa = 'Selamat Malam';
    }

    document.getElementById('sapaan').textContent = sapa + ', ' + userLogin.nama + '!';
    document.getElementById('info-user').textContent = 'Role: ' + userLogin.role + ' | Lokasi: ' + userLogin.lokasi;

    // Dropdown Laporan
    document.getElementById('btnLaporan').addEventListener('click', function(e) {
      e.preventDefault();
      var menu = document.getElementById('dropdownLaporan');
      if (menu.style.display === 'block') {
        menu.style.display = 'none';
      } else {
        menu.style.display = 'block';
      }
    });

    // Logout
    document.getElementById('btnLogout').addEventListener('click', function(e) {
  e.preventDefault();
  if (confirm('Apakah Anda yakin ingin keluar?')) {
    sessionStorage.removeItem('userLogin');
    window.location.href = 'index.html';
  }
});
  </script>


</body>
</html>
